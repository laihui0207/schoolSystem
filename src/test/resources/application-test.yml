# 测试环境配置
spring:
  application:
    name: school-system-test

  # 集成测试跑真 Postgres（迁移脚本是 PG 方言，H2 无法执行 V3 的表达式唯一索引）。
  # 指向本地 Docker 的专用测试库 school_system_test，Flyway 会在其上建表。
  # ponytail: 复用本地 Docker PG；有 Maven Central 网络后可换 Testcontainers 做临时容器隔离。
  # 连接池用 Hikari（Druid 在测试上下文有兼容问题）。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/school_system_test
    username: school_admin
    password: school_pass_2024
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # 集成测试连本地 Docker Redis（app 的 RedisConfig/JwtAuthenticationFilter 硬依赖 Redis，排除不掉）。
  # 用 database: 1 与开发环境(db 0)隔离键空间。
  data:
    redis:
      host: localhost
      port: 6379
      password: redis_pass_2024
      database: 1
      timeout: 10000ms

  # Flyway配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# MyBatis Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 日志配置
logging:
  level:
    root: INFO
    com.school: DEBUG

# 应用配置
app:
  jwt:
    secret: test-secret-key-for-unit-testing-only
    expiration: 3600000
    refresh-expiration: 86400000
  captcha:
    enabled: false
    expire: 300
