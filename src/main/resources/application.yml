spring:
  application:
    name: school-system

  profiles:
    active: dev

  config:
    import: optional:file:.env[.properties]

  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/school_system
    username: school_admin
    password: school_pass_2024
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat
      wall:
        enabled: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: redis_pass_2024
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Flyway配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: false

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  # Spring AI 配置
  ai:
    # 模型提供商：deepseek 或 ollama
    provider: ${AI_PROVIDER:deepseek}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: ${AI_DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 4096
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_OLLAMA_MODEL:qwen2.5:7b}
          temperature: 0.7
          num-predict: 4096

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.school.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# Server配置
server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 10

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# Springdoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.school.module

# 日志配置
logging:
  level:
    root: INFO
    com.school: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/school-system.log
    max-size: 10MB
    max-history: 30

# 应用配置
app:
  # JWT配置
  jwt:
    secret: school-system-secret-key-2024-change-in-production
    expiration: 86400000  # 24小时
    refresh-expiration: 604800000  # 7天

  # 验证码配置
  captcha:
    enabled: true
    expire: 300  # 5分钟

  # 文件上传配置
  file:
    upload-path: ./uploads
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx

  # PDF 成绩单配置：中文字体按顺序尝试（.ttc 用「路径,索引」指定子字体），全部不可读时回退 iText font-asian 内置的 fallback-font
  pdf:
    font-paths:
      - C:/Windows/Fonts/simhei.ttf
      - C:/Windows/Fonts/msyh.ttc,0
      - /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
      - /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc,0
    fallback-font: STSong-Light
    fallback-encoding: UniGB-UCS2-H

